name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install xmllint (XSD validation テスト用)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run licenses:check

      - run: npm run format:check

      - run: npm run check

      - run: npm run test

      - run: npm run build

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # ブラウザごとに並列で回す。globalSetup が chromium で dev server を温めるので、どの job にも chromium を入れる
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            install: chromium
            projects: --project=chromium --project=pwa-chromium
            skip-pwa: ''
          - browser: firefox
            install: chromium firefox
            projects: --project=firefox
            skip-pwa: '1'
          - browser: webkit
            install: chromium webkit
            projects: --project=webkit
            skip-pwa: '1'
    env:
      E2E_SKIP_PWA: ${{ matrix.skip-pwa }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # ブラウザのビルドは OS のリリースごとに違う。別のリリースで落としたブラウザは起動できない
      - name: Detect OS release
        id: os-release
        run: echo "id=$(. /etc/os-release && echo "${ID}${VERSION_ID}")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.os-release.outputs.id }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps ${{ matrix.install }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps ${{ matrix.install }}
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e -- ${{ matrix.projects }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: ${{ runner.temp }}/aoiko-playwright/report/
          retention-days: 7
  # パッケージ（インストーラ生成）以外はすべてこの repo にあるので、ネイティブ側もここで回す。
  # 配る対象（macOS / iOS / Windows）のうち macOS を使う。public repo なので
  # ランナー OS による課金差は無く、Linux 専用のスタブを維持する理由も無い。
  native:
    # 本番の Swift が 27 の API を使うため、ストア向けビルドと同じ Xcode 27.2 でコンパイルする。
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # cfg で分けている部分は、そのプラットフォーム向けに引かないと壊れていても気付けない。
      # cargo check はリンクしないので Xcode の設定は要らない。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Rust のキャッシュを保存するのは develop だけにする。PR のキャッシュはその PR からしか読めず、リポジトリのキャッシュ上限を圧迫する。
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - run: npm ci
      # 依存の追加・更新で、許可していないライセンスや本文を掲げられないクレートが配られるのを防ぐ。
      # cargo tree と cargo metadata しか使わない（ビルドはしない）ので、対象プラットフォームの toolchain は要らない。
      - run: npm run licenses:native:check
      # 枠（aoiko_fetch との契約）が壊れていれば、コンパイルより先に分かる。
      - run: npm run test:init
      # prettier は .rs を読めず、cargo test は整形を見ない。入れるまで誰も見て
      # いなかったので、実際に 2 箇所ずれたまま既定の枝に入っていた。
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # mobile_entry_point のガードもここに入っている。
      - run: npm run test:rust
      # Swift のテストを走らせるのはここだけ。test:rust はコンパイルまでで、テストは実行しない。
      - run: npm run test:swift
      # iOS の cfg 分岐は既定の target では一度も引かれない。
      - run: npm run check:ios
      # check:ios の Swift は Swift 5 の言語モードでビルドされる。iOS の SDK に対して Swift 6 の厳密な並行性検査を通すのはここだけ。
      - run: npm run check:ios:swift
  # native と並列に回す。リリース構成の成果物を含む Rust のキャッシュを、native とは別に持たせるために job を分けている。
  native-build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - run: npm ci
      # Tauri CLI、ネイティブ版のライセンス一覧を作る build-frontend.mjs、リリース構成のコンパイルを通す。
      # --no-bundle は .app を作らず、署名も要らない。
      - run: npm run tauri:build -- --no-bundle
