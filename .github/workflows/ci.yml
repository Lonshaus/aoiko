name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install xmllint (XSD validation テスト用)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run licenses:check

      - run: npm run format:check

      - run: npm run check

      - run: npm run test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ runner.temp }}/aoiko-playwright/report/
          retention-days: 7

  # 打包（インストーラ生成）以外はすべてこの repo にあるので、ネイティブ側もここで回す。
  # ubuntu を使うのは倍率が最も低いため（Linux 1x / Windows 2x / macOS 10x）。
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri は Linux で webkit2gtk へリンクする。cargo test を走らせるだけでも要る。
      # libssl-dev は native-tls 用。Linux では OS の OpenSSL へリンクする。
      # 配る対象は Windows / macOS / iOS なので、実際の配布物が OpenSSL を使うことは無い。
      - name: Linux の依存を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - run: npm ci

      # 依存の追加・更新でライセンス一覧が古くなったまま配られるのを防ぐ。
      # cargo metadata しか使わないので、対象プラットフォームの toolchain は要らない。
      - run: npm run licenses:native:check

      # 枠（aoiko_fetch との契約）が壊れていれば、コンパイルより先に分かる。
      - run: npm run test:init

      # mobile_entry_point のガードもここに入っている。
      - run: npm run test:rust
