# tauri-plugin-iap の macOS 実装は Swift で、11.0 向けに建てると並行実行ランタイムが
# @rpath 参照（back-deployment）になり、cargo test の裸の実行ファイルが dyld で落ちる。
# 出荷物は tauri.conf.json の minimumSystemVersion で 13.3 になるため起きない。
# cargo だけ Rust 既定の 11.0 に落ちるので、ここで出荷物と同じ値へ揃える。
#
# src-tauri/ ではなく repo 直下に置く。cargo は --manifest-path ではなく実行時の
# カレントディレクトリから上へ辿って config を探すため、`cargo test --manifest-path
# src-tauri/Cargo.toml` を repo 直下で回すと src-tauri/.cargo/ は読まれない。
#
# tauri 自身のビルドは MACOSX_DEPLOYMENT_TARGET を環境変数で渡してくる。[env] は
# 既に設定されている変数を上書きしない（force = true が無い）ので、そちらは素通りする。
[env]
MACOSX_DEPLOYMENT_TARGET = "13.3"
