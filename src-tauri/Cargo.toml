[package]
name = "aoiko-desktop"
version = "1.0.0"
description = "aoiko デスクトップ版"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aoiko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs が題名欄のアイコンを RGBA へ展開するのに使う。ビルド時にしか動かないので
# 出荷物には入らない。tauri-codegen が既に同じ版を使っており、crate は増えない。
png = { version = "0.18", default-features = false }

[dependencies]
# Android では IPC が生バイトを運べず、aoiko_fetch が base64 で受け取る。
base64 = "0.22"
# aoiko_fetch が扱う型。reqwest が再輸出しているのと同じ実体で、Android では
# reqwest を入れないためここで直に持つ。
http = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# バックアップフォルダの選択・解決と、その配下のファイル入出力すべて（issue #38）。
# plugin-fs の代わりで、全プラットフォームがこれを通る。
tauri-plugin-aoiko-native = { path = "plugins/tauri-plugin-aoiko-native" }

# 支援（アプリ内購入）。iOS / macOS は StoreKit 2、Windows は Microsoft Store API、
# Android は Play Billing。配る 4 つの環境にだけ入れる。
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "windows", target_os = "android"))'.dependencies]
tauri-plugin-iap = "0.10.0-rc.8"

# 印刷はネイティブ側で行う。WKWebView 上の window.print() は例外を投げるため
# （tauri#3066）、WKWebView の printOperationWithPrintInfo: を直接呼ぶ。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSGraphics",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
# Windows も同じ理由でネイティブ側へ回す。WebView2 の ShowPrintUI を呼ぶ。
# webview2-com は tauri 自身が cfg(windows) で使っている版に合わせる（controller() が
# ここの ICoreWebView2Controller を返すため、版がずれると型が合わない）。
# windows-core は ICoreWebView2 から ICoreWebView2_16 へ QueryInterface するために要る。
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# aoiko_fetch 用。cookie は使わないので入れない（送る先は OCR/LLM の API だけ）。
# TLS は native-tls＝OS のもの（macOS は Security.framework、Windows は Schannel）を使う。
# 自前の暗号実装を同梱すると輸出管理上の分類が変わるため持ち込まない。
# native-tls だけだと ALPN を要求しないので h2 が選ばれず、http2 を有効にしていても
# 実際の接続は HTTP/1.1 へ落ちる（実測）。native-tls-alpn は ALPN を有効にするだけ。
# Android には借りられる system TLS が無く native-tls が OpenSSL を要求するので、
# 送信そのものを Kotlin の HttpsURLConnection へ回し、reqwest ごと外す。
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "charset",
  "http2",
  "macos-system-configuration",
  "native-tls-alpn",
] }
